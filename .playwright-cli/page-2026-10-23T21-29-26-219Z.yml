                - cell "GPUs that join and leave (gaming PC, rented card)" [ref=e319]
                - cell "Kubernetes — after you cache images and weights" [ref=e320]
              - row "Two or more replicas of the same model Kaito + llm-d. Where the enterprise stack earns its keep" [ref=e321]:
                - cell "Two or more replicas of the same model" [ref=e322]
                - cell "Kaito + llm-d. Where the enterprise stack earns its keep" [ref=e323]:
                  - strong [ref=e324]: Kaito + llm-d.
                  - text: Where the enterprise stack earns its keep
          - paragraph [ref=e325]:
            - text: My first reason is
            - strong [ref=e326]: learning
            - text: ", the second is"
            - strong [ref=e327]: privacy
            - text: ". You will not save money and you will not run the best models. The moving parts tell the story: Ollama is one process; this stack is GPU Operator, HAMi, Kaito, Flux, Istio, llm-d and Prometheus, and each one can break the others."
          - paragraph [ref=e328]:
            - text: "The professional argument is real, though. vLLM, the Gateway API Inference Extension and llm-d are the same building blocks showing up in production platforms, and a homelab is the cheapest place to break them:"
            - emphasis [ref=e329]: my homelab is where I broke llm-d before I had to explain it to a customer.
          - heading "What this teaches you about production inference" [level=2] [ref=e330]
          - paragraph [ref=e331]: "The stack in this post is not a homelab toy version of something else. It is the same shape as what teams run in production: a GPU operator for device management, HAMi or MIG for sharing, vLLM for serving, the Gateway API Inference Extension for routing, and an autoscaler or model operator above it."
          - paragraph [ref=e332]: What changes at work is scale and consequence, not vocabulary. A replica that takes 28 minutes to become Ready is a demo problem at home and an incident in production. A device plugin that fights another one is a puzzling evening here and a failed rollout there.
          - paragraph [ref=e333]: "That is the argument for running this at home: you meet the failure modes on hardware where the blast radius is your own weekend."
          - 'heading "Pitfalls: HAMi, Kaito and llm-d" [level=2] [ref=e334]'
          - list [ref=e335]:
            - listitem [ref=e336]:
              - strong [ref=e337]: One device plugin per GPU vendor.
              - text: HAMi replaces NVIDIA’s. Disable the GPU Operator’s and Kaito’s, or they fight.
            - listitem [ref=e338]:
              - strong [ref=e339]: One NFD.
              - text: Two Node Feature Discovery instances cost me the GPU labels Kaito sizes vLLM from.
            - listitem [ref=e340]:
              - strong [ref=e341]: Ghost GPUs.
              - text: A card moved to another machine leaves a
              - code [ref=e342]: NodeFeature
              - text: object behind, and NFD re-applies the old labels from it. Delete the object, not just the labels.
            - listitem [ref=e343]:
              - strong [ref=e344]: A driver upgrade without a reboot
              - text: gives
              - code [ref=e345]: Driver/library version mismatch
              - text: "and crash-looping GPU pods. It happened twice: once by hand, once by unattended upgrades on talk day. Pin the NVIDIA packages with"
              - code [ref=e346]: apt-mark hold
              - text: .
            - listitem [ref=e347]:
              - strong [ref=e348]: Rolling updates need spare VRAM.
              - text: On a fully sliced card the new pod stays
              - code [ref=e349]: Pending
              - text: next to the old one. Use
              - code [ref=e350]: "strategy: Recreate"
              - text: .
            - listitem [ref=e351]:
              - strong [ref=e352]: A “supported” CUDA image may not support your GPU.
              - text: The official whisper.cpp CUDA image skips Pascal; it fails at the first request, not at startup. Test a real request before calling a workload Ready.
            - listitem [ref=e353]:
              - strong [ref=e354]: OpenAI-compatible isn’t always compatible.
              - text: Open WebUI sends
              - code [ref=e355]: "tool_choice: \"auto\""
              - text: ", which vLLM rejects unless started with"
              - code [ref=e356]: "--enable-auto-tool-choice"
              - text: and a tool-call parser. Kaito does not set them.
          - heading "FAQ" [level=2] [ref=e357]
          - heading "Does HAMi work with AMD GPUs?" [level=3] [ref=e358]
          - paragraph [ref=e359]: Instinct cards only. The RX 6900 XT is not supported; it runs llama.cpp on Vulkan instead.
          - heading "Can vLLM run on a GTX 1080 Ti?" [level=3] [ref=e360]
          - paragraph [ref=e361]: No. vLLM needs compute capability 7.0 or newer (Volta and later); Pascal is 6.1. llama.cpp CUDA works on the same card.
          - heading "How much VRAM does a 7B model need at Q4?" [level=3] [ref=e362]
          - paragraph [ref=e363]: Roughly 0.6 GB per billion parameters for the weights, plus the KV cache. A 7B model at Q4_K_M is about 4.5 GB, so plan for 6 to 8 GB to leave room for context.
          - heading "Is Kubernetes worth it for a single GPU?" [level=3] [ref=e364]
          - paragraph [ref=e365]: No. Ollama or LM Studio on the host gives you one moving part. Kubernetes starts paying off with several services, several GPUs, or GPUs that join and leave.
          - heading "Why does llm-d need more than one replica?" [level=3] [ref=e366]
          - paragraph [ref=e367]: The router picks a replica per request, scoring queue depth, KV-cache use and prefix affinity. With one replica there is nothing to choose between, so it is plumbing without a payoff.
          - heading "What I did not do" [level=2] [ref=e368]
          - paragraph [ref=e369]: No like-for-like Ollama comparison on the same GPU, so the “is Kubernetes worth it” answer is an argument, not a measurement. No two Kaito replicas on one card through HAMi, so llm-d’s cache-aware routing is wired and timed but not demonstrated. And the OCR route through docling on the GPU was 1.5 s per page against 12–72 s on CPU, but tables came back empty, so Paperless still runs on CPU.
          - paragraph [ref=e370]: Those are the next three experiments, and the reason there will be a part two.
          - separator [ref=e371]
