          - paragraph [ref=e297]:
            - text: "And then the rented-GPU lesson:"
            - strong [ref=e298]: destroying the vast.ai instance deletes the image and the weights with it.
            - text: The next node starts the 22 + 28 minutes again. Ephemeral inference only works if images and models are cached somewhere that outlives the GPU — a registry mirror and a model store on real disks. I learned that the expensive way, twice.
          - heading "vLLM or Ollama?" [level=2] [ref=e299]
          - paragraph [ref=e300]: I did not benchmark Ollama on these cards, so this is an argument, not a measurement. Ollama is one binary serving one model to one user, and it is the right answer for most homelabs.
          - paragraph [ref=e301]:
            - text: "vLLM’s advantage appears when requests arrive together:"
            - strong [ref=e302]: 223,622 tokens per minute
            - text: at 40 concurrent requests on one 3090 is a different class of throughput from a single-user server. It also exposes the queue and KV-cache metrics that llm-d needs in order to route. If you are the only user, the difference is operational. If several people or apps share the endpoint, it is the point.
