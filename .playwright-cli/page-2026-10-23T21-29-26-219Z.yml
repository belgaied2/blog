        - generic [ref=e78]:
          - paragraph [ref=e79]:
            - text: Five years ago Dan Garfield gave a talk called
            - emphasis [ref=e80]: The Quest for the Ultimate Kubernetes Homelab
            - text: ", and the line that stuck was that the cluster in your closet isn’t a toy: it’s where you learn what you do later at work. Mine runs the photo library, the password manager, the CRM and the document archive. In October 2026 I gave a talk at"
            - strong [ref=e81]: KCD Edinburgh
            - text: asking whether it can also run a
            - emphasis [ref=e82]: useful
            - text: LLM, with the same stack an enterprise would use.
          - paragraph [ref=e83]: "Short answer: yes, and you probably shouldn’t, unless learning is the point. The measurements below are from the week before the talk."
          - heading "Three cards, none of them datacenter" [level=2] [ref=e84]
          - paragraph [ref=e85]: "The demo cluster was k3s with Cilium on a mini-PC control plane, with two cards at home and one rented:"
          - table [ref=e86]:
            - rowgroup [ref=e87]:
              - row "GPU VRAM What it runs" [ref=e88]:
                - columnheader "GPU" [ref=e89]
                - columnheader "VRAM" [ref=e90]
                - columnheader "What it runs" [ref=e91]
            - rowgroup [ref=e92]:
              - 'row "GTX 1080 Ti (2017, Pascal) 11 GB llama.cpp CUDA in HAMi slices. No vLLM: compute capability 6.1, it needs ≥ 7.0" [ref=e93]':
                - cell "GTX 1080 Ti (2017, Pascal)" [ref=e94]
                - cell "11 GB" [ref=e95]
                - 'cell "llama.cpp CUDA in HAMi slices. No vLLM: compute capability 6.1, it needs ≥ 7.0" [ref=e96]':
                  - text: llama.cpp CUDA in HAMi slices.
                  - strong [ref=e97]: No vLLM
                  - text: ": compute capability 6.1, it needs ≥ 7.0"
              - row "RX 6900 XT (2020, RDNA2) 16 GB llama.cpp on Vulkan. No HAMi, no Kaito, no vLLM" [ref=e98]:
                - cell "RX 6900 XT (2020, RDNA2)" [ref=e99]
                - cell "16 GB" [ref=e100]
                - cell "llama.cpp on Vulkan. No HAMi, no Kaito, no vLLM" [ref=e101]
              - row "RTX 3090 (rented on vast.ai) 24 GB vLLM through Kaito, behind llm-d" [ref=e102]:
                - cell "RTX 3090 (rented on vast.ai)" [ref=e103]
                - cell "24 GB" [ref=e104]
                - cell "vLLM through Kaito, behind llm-d" [ref=e105]
          - paragraph [ref=e106]:
            - text: "The 3090 is the interesting one:"
            - strong [ref=e107]: $0.35–0.46 an hour on vast.ai
            - text: ", joined to the LAN over a WireGuard split tunnel, roughly 130 ms from the control plane. That is not a detail, it is the whole argument for “ephemeral inference” — and later in this post it is also the reason a demo broke."
          - heading "What it is actually for" [level=2] [ref=e108]
          - paragraph [ref=e109]: "Inference you can point at is worth more than a benchmark. The cluster serves:"
          - list [ref=e110]:
            - listitem [ref=e111]:
              - strong [ref=e112]: Paperless-ngx
              - text: ": OCR, tagging and summarising scanned documents."
            - listitem [ref=e113]:
              - strong [ref=e114]: Twenty CRM
              - text: ": enriching and summarising contacts."
            - listitem [ref=e115]:
              - strong [ref=e116]: Open WebUI
              - text: ": the family chat window."
            - listitem [ref=e117]:
              - strong [ref=e118]: Meeting transcripts
              - text: ": recorded on a phone, transcribed locally."
            - listitem [ref=e119]:
              - strong [ref=e120]: Home Assistant
              - text: ": local voice, Whisper → small LLM → Piper."
            - listitem [ref=e121]:
              - strong [ref=e122]: Agents
              - text: ": anything that would otherwise call a paid API."
          - paragraph [ref=e123]:
            - text: "Privacy is the honest motivation: documents, photos and family conversations never leave the network. Offline is the second. But local covers the boring 80%, not the hard 20%: a small model greeted the audience with"
            - emphasis [ref=e124]: “Hello, KCD Edinburgh — your Graph Partitioning Enthusiasts’ meeting spot since 1993!”
          - 'heading "HAMi: GPU sharing, four workloads on one 11 GB card" [level=2] [ref=e125]'
          - paragraph [ref=e126]: "This is the part worth doing even if you skip everything else. HAMi slices GPU memory between pods. On the 1080 Ti, four services ran at once:"
          - table [ref=e127]:
            - rowgroup [ref=e128]:
              - row "Pod Model Slice Used" [ref=e129]:
                - columnheader "Pod" [ref=e130]
                - columnheader "Model" [ref=e131]
                - columnheader "Slice" [ref=e132]
                - columnheader "Used" [ref=e133]
            - rowgroup [ref=e134]:
              - row "chat Gemma 4 E4B 6800 MiB 3400 MiB" [ref=e135]:
                - cell "chat" [ref=e136]
                - cell "Gemma 4 E4B" [ref=e137]
                - cell "6800 MiB" [ref=e138]
                - cell "3400 MiB" [ref=e139]
              - row "embeddings nomic-embed-text v1.5 Q8_0 1500 MiB 290 MiB" [ref=e140]:
                - cell "embeddings" [ref=e141]
                - cell "nomic-embed-text v1.5 Q8_0" [ref=e142]
                - cell "1500 MiB" [ref=e143]
                - cell "290 MiB" [ref=e144]
              - row "speech-to-text Whisper large-v3-turbo (int8) 1500 MiB 944 MiB" [ref=e145]:
                - cell "speech-to-text" [ref=e146]
                - cell "Whisper large-v3-turbo (int8)" [ref=e147]
                - cell "1500 MiB" [ref=e148]
                - cell "944 MiB" [ref=e149]
              - row "OCR Granite-Docling-258M Q8_0 1200 MiB 638 MiB" [ref=e150]:
                - cell "OCR" [ref=e151]
                - cell "Granite-Docling-258M Q8_0" [ref=e152]
                - cell "1200 MiB" [ref=e153]
                - cell "638 MiB" [ref=e154]
          - paragraph [ref=e155]: Four workloads on one card, 11,000 of 11,264 MiB allocated, and the card sits at about 4.4 GB when idle. A 1080 Ti that would otherwise be idle most of the day becomes four services.
          - paragraph [ref=e156]:
            - text: Performance is fine.
            - strong [ref=e157]: ~60 tok/s
            - text: for Gemma 4 E4B in a 6.8 GB slice,
            - strong [ref=e158]: 94.6 tok/s
            - text: for Llama 3.2 3B in 5 GB. Whisper large-v3-turbo transcribes 11 seconds of audio in
            - strong [ref=e159]: 0.96 s
            - text: warm, 6.8 s on the first call while the model loads. The OCR pass gets a synthetic invoice 100% right, table included, in 6.5 s cold and 1.7 s warm.
          - paragraph [ref=e160]: "The isolation is real, and you can prove it from inside a pod:"
          - generic [ref=e161]:
            - code [ref=e162]: "$ kubectl exec chat -- nvidia-smi memory.total: 5000 MiB # the card is 11264 $ # loading a second model in the same pod: [HAMI-core ERROR] Device 0 OOM 5312842368 / 5242880000"
            - button "Copy" [ref=e163] [cursor=pointer]
          - paragraph [ref=e164]: Refused at the slice boundary while the card still had ~7 GB free. That is the feature working, but it surprises people who expect the scheduler to be clever.
          - paragraph [ref=e165]:
            - text: Two limits matter. It is
            - strong [ref=e166]: memory isolation, not performance isolation
            - text: ": a busy pod slows its neighbours. And"
            - strong [ref=e167]: anything on the GPU outside Kubernetes is invisible to HAMi
            - text: — Open WebUI, running in Docker on the same machine, quietly held 242 MiB for its built-in embeddings until I pointed it at the cluster’s service.
          - 'heading "The RX 6900 XT: the fastest card that supports nothing" [level=2] [ref=e168]'
          - paragraph [ref=e169]:
            - text: The RX 6900 XT has no HAMi, no Kaito, no vLLM. It is a plain Deployment running llama.cpp on Vulkan, and it is
            - strong [ref=e170]: the fastest card in the cluster
            - text: ": on the same Llama 3.2 3B,"
            - strong [ref=e171]: 177.7 tok/s against the 1080 Ti’s 99.0
            - text: .
          - paragraph [ref=e172]: Kubernetes still schedules it. You just don’t get slicing or smart routing. If you have a consumer AMD card, stop reading the rest of this post and install llama.cpp.
          - paragraph [ref=e173]: "Where it gets interesting is MoE models with RAM offload. Qwen3.6-35B-A3B (21 GiB at Q4) runs on 16 GB of VRAM plus system RAM:"
          - table [ref=e174]:
            - rowgroup [ref=e175]:
              - row "Setting Generation" [ref=e176]:
                - columnheader "Setting" [ref=e177]
                - columnheader "Generation" [ref=e178]
            - rowgroup [ref=e179]:
              - row "--n-cpu-moe 14 (14 layers of experts in RAM) 45.3 tok/s" [ref=e180]:
                - cell "--n-cpu-moe 14 (14 layers of experts in RAM)" [ref=e181]:
                  - code [ref=e182]: "--n-cpu-moe 14"
                  - text: (14 layers of experts in RAM)
                - cell "45.3 tok/s" [ref=e183]:
                  - strong [ref=e184]: 45.3 tok/s
              - row "--n-cpu-moe 10 (more on GPU) 22.3 tok/s" [ref=e185]:
                - cell "--n-cpu-moe 10 (more on GPU)" [ref=e186]:
                  - code [ref=e187]: "--n-cpu-moe 10"
                  - text: (more on GPU)
                - cell "22.3 tok/s" [ref=e188]:
                  - strong [ref=e189]: 22.3 tok/s
              - row "--n-cpu-moe 14 + MTP speculative decoding 25.9 tok/s" [ref=e190]:
                - cell "--n-cpu-moe 14 + MTP speculative decoding" [ref=e191]:
                  - code [ref=e192]: "--n-cpu-moe 14"
                  - text: + MTP speculative decoding
                - cell "25.9 tok/s" [ref=e193]
          - paragraph [ref=e194]:
            - text: More layers on the GPU is
            - emphasis [ref=e195]: slower
            - text: ", because the GPU part no longer fits and the driver spills into system memory. Speculative decoding makes it worse for the same reason: verifying drafted tokens touches more experts on the CPU per step, despite 55% draft acceptance."
          - paragraph [ref=e196]: "The KV cache matters even more. Same model, 64k context, a 60,218-token prompt:"
          - table [ref=e197]:
            - rowgroup [ref=e198]:
              - row "KV cache Generation Time to read the prompt Correct answer" [ref=e199]:
                - columnheader "KV cache" [ref=e200]
                - columnheader "Generation" [ref=e201]
                - columnheader "Time to read the prompt" [ref=e202]
                - columnheader "Correct answer" [ref=e203]
            - rowgroup [ref=e204]:
              - row "q8_0 23.8 tok/s 761 s yes" [ref=e205]:
                - cell "q8_0" [ref=e206]
                - cell "23.8 tok/s" [ref=e207]
                - cell "761 s" [ref=e208]:
                  - strong [ref=e209]: 761 s
                - cell "yes" [ref=e210]
              - row "q4_0 44.6 tok/s 155 s yes" [ref=e211]:
                - cell "q4_0" [ref=e212]
                - cell "44.6 tok/s" [ref=e213]
                - cell "155 s" [ref=e214]:
                  - strong [ref=e215]: 155 s
                - cell "yes" [ref=e216]
          - paragraph [ref=e217]: Same answer, five times faster. Quantising the KV cache took reading a 60k-token document from thirteen minutes to two and a half. If long documents are your use case, do that before buying more VRAM.
          - 'heading "Kaito: a model as a custom resource" [level=2] [ref=e218]'
          - paragraph [ref=e219]:
            - text: Kaito turns a model into a Kubernetes object. An
            - code [ref=e220]: InferenceSet
            - text: "produces vLLM pods from a preset or any Hugging Face model:"
          - generic [ref=e222]:
            - code [ref=e223]:
              - generic [ref=e225]: "apiVersion: kaito.sh/v1alpha1"
              - generic [ref=e227]: "kind: InferenceSet"
              - generic [ref=e229]: "metadata:"
              - generic [ref=e231]: "name: phi-4-mini"
              - generic [ref=e233]: "spec:"
              - generic [ref=e235]: "replicas: 1"
              - generic [ref=e237]: "template:"
              - generic [ref=e239]: "model:"
              - generic [ref=e241]: "name: phi-4-mini"
            - button "Copy" [ref=e242] [cursor=pointer]
          - paragraph [ref=e243]:
            - text: "Throughput is the reason to bother:"
            - strong [ref=e244]: 223,622 tokens per minute
            - text: at 40 concurrent requests (2048 in, 256 out), average TTFT 2.6 s, 89 ms per output token, on one 3090.
          - paragraph [ref=e245]:
            - text: Bring-your-own-node is where it gets sharp.
            - strong [ref=e246]:
              - code [ref=e247]: featureGates.disableNodeAutoProvisioning=true
              - text: is not enough
            - text: ": without"
            - code [ref=e248]: "nodeProvisioner: byo"
            - text: ", every Workspace is rejected with"
            - code [ref=e249]: instanceType is required when node auto-provisioning is enabled
            - text: . The value is only documented in the controller source.
          - paragraph [ref=e250]: "Three more that cost real time:"
          - list [ref=e251]:
            - listitem [ref=e252]:
              - strong [ref=e253]: The chart ships its own NVIDIA device plugin and its own NFD/GFD.
              - text: Next to HAMi and the GPU Operator, two device plugins fight, and the second NFD master
              - emphasis [ref=e254]: wiped the GPU labels Kaito needs
              - text: to size vLLM. Disable both, then restart the GPU Operator’s NFD and GFD.
            - listitem [ref=e255]:
              - strong [ref=e256]: The served model name is the InferenceSet name
              - text: (
              - code [ref=e257]: phi-4-mini
              - text: ), not the preset name. Requests to the preset name return 404.
            - listitem [ref=e258]:
              - strong [ref=e259]: Kaito asks for whole GPUs
              - text: (
              - code [ref=e260]: "nvidia.com/gpu: 1"
              - text: ", no memory limit), so under HAMi a Kaito pod takes the entire card."
              - code [ref=e261]: resource.partition
              - text: is MIG-only, which consumer cards do not have.
          - 'heading "llm-d: routing that needs two replicas" [level=2] [ref=e262]'
          - paragraph [ref=e263]:
            - text: llm-d puts a router in front of an
            - code [ref=e264]: InferencePool
            - text: . The EPP scores replicas by queue depth, KV-cache use and prefix-cache affinity, so prompts sharing a prefix land on the replica that already cached it. Round-robin does the opposite and wastes the cache.
          - paragraph [ref=e265]:
            - text: "It works:"
            - strong [ref=e266]: 22 tokens in 0.40 s end to end
            - text: through the Istio gateway and the router, against 29 tokens in 0.52 s directly to the pod. The router adds no visible latency.
          - paragraph [ref=e267]:
            - text: "And the honest part:"
            - strong [ref=e268]: with one replica, there is nothing to choose between.
            - text: llm-d is plumbing until you run two or more replicas of the same model, which at home needs two GPUs, or one GPU sliced by HAMi — the experiment I ran out of time for.
          - paragraph [ref=e269]:
            - text: Two practical notes. Kaito only creates the InferencePool and router for an
            - code [ref=e270]: InferenceSet
            - text: ; a plain
            - code [ref=e271]: Workspace
            - text: gets none. And neither Cilium’s gateway nor Traefik implements the Gateway API Inference Extension, so Istio runs gateway-only next to Cilium, no sidecars.
          - 'heading "Cold starts: 22 minutes for an image, 28 for a model" [level=2] [ref=e272]'
          - paragraph [ref=e273]: Kubernetes is not slow. Pulling five gigabytes of weights is.
